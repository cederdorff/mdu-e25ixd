name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run slides:build
      - name: Copy semester overview
        run: |
          mkdir -p dist/semesteroverblik
          cp semesteroverblik/semesteroversigt.html dist/semesteroverblik/
      - name: Copy Markdown files
        run: |
          while IFS= read -r -d '' file; do
            relative_path="${file#./}"
            mkdir -p "dist/$(dirname "$relative_path")"
            cp "$file" "dist/$relative_path"
          done < <(find . -type f -name '*.md' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './dist/*' \
            -print0)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
