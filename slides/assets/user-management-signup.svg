<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Sign up: Server Action'en opretter først login'et med signUp og derefter en række i users med insert. Begge har samme id.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .panel { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.5; }
      .ok { fill: #eef7f0; stroke: #a7d7b4; stroke-width: 1.5; }
      .bad { fill: #fdf1e7; stroke: #f2bf94; stroke-width: 1.5; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; fill: #6b7280; }
      .kicker-ok { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; fill: #1f6b3a; }
      .kicker-bad { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; fill: #9a3412; }
      .title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0d0d0d; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0d0d0d; }
      .code-sm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #374151; }
      .q { font-size: 16px; font-weight: 700; fill: #0d0d0d; }
      .desc { font-size: 13px; fill: #4b5563; }
      .type { font-size: 12px; fill: #6b7280; text-anchor: end; }
      .label { font-size: 12px; font-weight: 700; fill: #374151; text-anchor: middle; }
      .flow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #e5e7eb; stroke-width: 1; }
      .mid { text-anchor: middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="880" height="330" rx="16" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- Form -->
  <rect class="card" x="30" y="70" width="190" height="190" rx="12"/>
  <text class="kicker" x="50" y="98">BROWSEREN · /signup</text>
  <rect class="panel" x="50" y="112" width="150" height="30" rx="6"/><text class="desc" x="62" y="132">Name</text>
  <rect class="panel" x="50" y="150" width="150" height="30" rx="6"/><text class="desc" x="62" y="170">Email</text>
  <rect class="panel" x="50" y="188" width="150" height="30" rx="6"/><text class="desc" x="62" y="208">Password</text>
  <rect x="50" y="226" width="90" height="24" rx="6" fill="#0d0d0d"/><text x="95" y="243" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Sign up</text>

  <line class="flow" x1="222" y1="165" x2="268" y2="165"/>

  <!-- Server -->
  <rect class="panel" x="270" y="30" width="300" height="270" rx="14"/>
  <text x="290" y="60" font-size="16" font-weight="700" fill="#374151">På serveren · signUp</text>
  <rect class="card" x="290" y="85" width="260" height="70" rx="10"/>
  <text class="kicker" x="306" y="108">1 · OPRET LOGIN'ET</text>
  <text class="code-sm" x="306" y="134">supabase.auth.signUp()</text>
  <rect class="card" x="290" y="195" width="260" height="70" rx="10"/>
  <text class="kicker" x="306" y="218">2 · OPRET DIN RÆKKE</text>
  <text class="code-sm" x="306" y="244">.from("users").insert()</text>
  <line class="flow" x1="420" y1="157" x2="420" y2="192"/>

  <!-- Result -->
  <line class="flow" x1="552" y1="120" x2="618" y2="120"/>
  <line class="flow" x1="552" y1="230" x2="618" y2="230"/>
  <rect class="card" x="620" y="80" width="230" height="80" rx="10"/>
  <text class="kicker" x="636" y="104">LOGIN · AUTHENTICATION</text>
  <text class="code" x="636" y="132">id: 7f3a…</text>
  <text class="desc" x="636" y="150">dig@eaaa.dk</text>
  <rect class="ok" x="620" y="190" width="230" height="80" rx="10"/>
  <text class="kicker-ok" x="636" y="214">RÆKKE I USERS</text>
  <text class="code" x="636" y="242">id: 7f3a…</text>
  <text class="desc" x="636" y="260">name: Dig</text>
  <text class="label" x="735" y="181">samme id</text>
</svg>
