<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Tre lag: Requests fra appen går gennem UI, server og database. En request fra Thunder Client går uden om appen direkte til databasen, så kun databasen ser alle requests.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .panel { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.5; }
      .ok { fill: #eef7f0; stroke: #a7d7b4; stroke-width: 1.5; }
      .bad { fill: #fdf1e7; stroke: #f2bf94; stroke-width: 1.5; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; fill: #6b7280; }
      .kicker-ok { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; fill: #1f6b3a; }
      .kicker-bad { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; fill: #9a3412; }
      .title { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 20px; font-weight: 700; fill: #0d0d0d; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #0d0d0d; }
      .code-sm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #374151; }
      .q { font-size: 16px; font-weight: 700; fill: #0d0d0d; }
      .desc { font-size: 13px; fill: #4b5563; }
      .type { font-size: 12px; fill: #6b7280; text-anchor: end; }
      .label { font-size: 12px; font-weight: 700; fill: #374151; text-anchor: middle; }
      .flow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #e5e7eb; stroke-width: 1; }
      .mid { text-anchor: middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="880" height="330" rx="16" fill="#ffffff" stroke="#e5e5e5"/>

  <rect class="card" x="30" y="122" width="140" height="64" rx="10"/>
  <text class="kicker" x="46" y="147">REQUEST FRA</text><text class="q" x="46" y="172">Appen</text>
  <rect class="bad" x="30" y="226" width="140" height="64" rx="10"/>
  <text class="kicker-bad" x="46" y="251">REQUEST FRA</text><text class="q" x="46" y="276">Thunder Client</text>

  <rect class="panel" x="210" y="30" width="190" height="180" rx="12"/>
  <text class="kicker" x="228" y="58">UI · OPGAVE 3.1</text>
  <text class="q" x="228" y="84">Skjul knappen</text>
  <text class="desc" x="228" y="106">God oplevelse –</text>
  <text class="desc" x="228" y="124">ingen beskyttelse</text>

  <rect class="panel" x="430" y="30" width="190" height="180" rx="12"/>
  <text class="kicker" x="448" y="58">SERVER · OPGAVE 3.2</text>
  <text class="q" x="448" y="84">Tjek på serveren</text>
  <text class="desc" x="448" y="106">Beskytter appen</text>

  <rect class="ok" x="650" y="30" width="200" height="270" rx="12"/>
  <text class="kicker-ok" x="668" y="58">DATABASE · OPGAVE 4</text>
  <text class="q" x="668" y="84">Row Level Security</text>
  <text class="desc" x="668" y="106">Beskytter data</text>

  <path class="flow" d="M172 160 L640 160"/>
  <circle cx="305" cy="160" r="5" fill="#6b7280"/><circle cx="525" cy="160" r="5" fill="#6b7280"/>
  <path class="flow" d="M172 258 L640 258" style="stroke:#c2410c"/>
  <text class="label" x="415" y="246" style="fill:#9a3412">request med publishable key – uden om appen</text>
  <text class="desc" x="668" y="264" style="font-weight:700; fill:#1f6b3a">Ser alle requests</text>
</svg>
