<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Mappen er routen: hver mappe i app/ med en page.js bliver til en URL</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .tree { white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; fill: #374151; }
      .dir { font-weight: 700; fill: #0d0d0d; }
      .page { fill: #1f6b3a; font-weight: 700; }
      .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .route { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; fill: #0d0d0d; }
      .note { font-size: 13px; fill: #4b5563; text-anchor: end; }
      .flow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .head { font-size: 16px; font-weight: 700; fill: #374151; }
    </style>
  </defs>

  <rect x="0" y="0" width="880" height="400" rx="16" fill="#ffffff" stroke="#e5e5e5"/>

  <!-- Mappen -->
  <rect x="20" y="20" width="360" height="360" rx="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="head" x="44" y="54">Mapper og filer</text>
  <text class="tree" x="44" y="100"><tspan class="dir">app/</tspan></text>
  <text class="tree" x="44" y="138">├── <tspan class="page">page.js</tspan></text>
  <text class="tree" x="44" y="176">├── <tspan class="dir">signup/</tspan></text>
  <text class="tree" x="44" y="210">│   └── <tspan class="page">page.js</tspan></text>
  <text class="tree" x="44" y="248">├── <tspan class="dir">login/</tspan></text>
  <text class="tree" x="44" y="282">│   └── <tspan class="page">page.js</tspan></text>
  <text class="tree" x="44" y="320">└── <tspan class="dir">profile/</tspan></text>
  <text class="tree" x="44" y="354">    └── <tspan class="page">page.js</tspan></text>

  <!-- URL'erne -->
  <rect x="500" y="20" width="360" height="360" rx="14" fill="#eef7f0" stroke="#a7d7b4" stroke-width="1.5"/>
  <text class="head" x="524" y="54" style="fill: #1f6b3a">URL'en i browseren</text>

  <rect class="card" x="524" y="114" width="312" height="44" rx="10"/>
  <text class="route" x="544" y="142">/</text>
  <text class="note" x="820" y="141">forsiden</text>

  <rect class="card" x="524" y="186" width="312" height="44" rx="10"/>
  <text class="route" x="544" y="214">/signup</text>
  <text class="note" x="820" y="213">opgave 2</text>

  <rect class="card" x="524" y="258" width="312" height="44" rx="10"/>
  <text class="route" x="544" y="286">/login</text>
  <text class="note" x="820" y="285">opgave 3</text>

  <rect x="524" y="330" width="312" height="44" rx="10" fill="#fdf1e7" stroke="#f2bf94" stroke-width="1.5"/>
  <text class="route" x="544" y="358">/profile</text>
  <path d="M719 349 v-3.5 a4 4 0 0 1 8 0 v3.5" fill="none" stroke="#b45309" stroke-width="2"/>
  <rect x="716" y="349" width="14" height="11" rx="2" fill="#b45309"/>
  <text class="note" x="820" y="357" style="fill: #9a3412">opgave 4</text>

  <!-- Pile -->
  <line class="flow" x1="200" y1="133" x2="520" y2="136"/>
  <line class="flow" x1="245" y1="205" x2="520" y2="208"/>
  <line class="flow" x1="245" y1="277" x2="520" y2="280"/>
  <line class="flow" x1="245" y1="349" x2="520" y2="352"/>
</svg>
