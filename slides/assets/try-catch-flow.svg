<svg xmlns="http://www.w3.org/2000/svg" width="514" height="411" viewBox="0 0 514 411" role="img" aria-labelledby="title description">
  <title id="title">Try catch flow</title>
  <desc id="description">Without errors, catch is ignored. If an error occurs, the rest of try is ignored and catch executes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 Z" fill="#747794" /></marker>
    <style>
      .copy { fill: #989ab3; font: 700 12px Aptos, Segoe UI, Arial, sans-serif; }
      .code { fill: #989ab3; font: 700 14px "SFMono-Regular", Consolas, monospace; }
      .line { fill: none; stroke: #747794; stroke-width: 3; marker-end: url(#arrow); }
      .shape { fill: #282931; stroke: #5f617d; stroke-width: 2; }
    </style>
  </defs>
  <rect width="514" height="411" rx="18" fill="#24252b" />

  <rect x="214" y="18" width="86" height="30" rx="15" class="shape" />
  <text x="257" y="38" text-anchor="middle" class="copy">Begin</text>
  <path d="M257 48 V78" class="line" />

  <path d="M257 78 L352 130 L257 182 L162 130 Z" class="shape" />
  <text x="257" y="121" text-anchor="middle" class="code">try {</text>
  <text x="257" y="142" text-anchor="middle" class="code">// code...</text>
  <text x="257" y="163" text-anchor="middle" class="code">}</text>

  <path d="M162 130 H86 V225" class="line" />
  <text x="86" y="198" text-anchor="middle" class="copy">No Errors</text>
  <rect x="24" y="242" width="172" height="54" rx="27" class="shape" />
  <text x="110" y="276" text-anchor="middle" class="copy">Ignore catch block</text>

  <path d="M352 130 H428 V225" class="line" />
  <text x="422" y="198" text-anchor="middle" class="copy">An error occured in the code</text>
  <rect x="318" y="242" width="172" height="54" rx="27" class="shape" />
  <text x="404" y="276" text-anchor="middle" class="copy">Ignore the rest of try</text>
  <path d="M404 296 V332" class="line" />
  <rect x="318" y="346" width="172" height="54" rx="27" class="shape" />
  <text x="404" y="380" text-anchor="middle" class="copy">Execute catch block</text>
</svg>
